# Modules this radio does not use. Keeping them out saves a bit of memory and
# avoids pointless probes. Idea from the X6100 firmware by IU1WXY.
blacklist sunxi_cedrus   # hardware video decoder: unused
blacklist joydev         # no joysticks
blacklist bnep           # Bluetooth networking (PAN): unused, we use SPP/A2DP
